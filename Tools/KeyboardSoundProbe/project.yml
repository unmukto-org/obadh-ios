name: ObadhSoundProbe
options:
  deploymentTarget:
    iOS: "18.0"
targets:
  ObadhSoundProbe:
    type: application
    platform: iOS
    sources: [Sources]
    configFiles:
      Debug: ../../Config/Signing.xcconfig
      Release: ../../Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OBADH_APP_BUNDLE_ID).soundprobe
        PRODUCT_NAME: ObadhSoundProbe
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Obadh Sound Probe
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
schemes:
  ObadhSoundProbe:
    build:
      targets:
        ObadhSoundProbe: all
    run:
      config: Release
